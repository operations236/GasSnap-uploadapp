server {
    if ($host = upload.gassnap.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name upload.gassnap.io;

    # Redirect HTTP to HTTPS (recommended)
    return 301 https://$server_name$request_uri;


}

server {
    listen 443 ssl;
    server_name upload.gassnap.io;

    # Use your existing SSL certificate (adjust paths if needed)
    ssl_certificate /etc/letsencrypt/live/gassnap.io-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gassnap.io-0001/privkey.pem; # managed by Certbot

    # Security headers (optional but recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # InvUpload allows photos/PDFs up to 10 MB in app code.
    # Without this, nginx defaults to 1m and aborts larger uploads
    # (iPhone often shows a generic "Connection Error").
    client_max_body_size 12m;

    location / {
        # Basic Auth removed 2026-07-20 — replaced by server-side PIN +
        # session-cookie enforcement in the app itself (main.py), which
        # closes the actual gap (client-side-only PIN was bypassable by
        # hitting the API directly). See INFRA_INVENTORY.md.
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large mobile PDFs / slow cellular
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }

}
